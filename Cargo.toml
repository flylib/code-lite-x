[workspace]
resolver = "2"
members = [
    "crates/code-lite-core",
    "crates/code-lite-storage",
    "crates/code-lite-fs",
    "crates/code-lite-app",
    "crates/code-lite-agent",
    "crates/code-lite-ffi",
    "crates/code-lite-graph",
    "crates/code-lite-lsp",
    "crates/code-lite-rpc",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["CodeLiteX Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ropey = "1.6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
similar = { version = "2.6", features = ["inline"] }
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
regex = "1.11"
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
ureq = { version = "3.1.4", features = ["json"] }
