name: code_lite_ui
description: "CodeLiteX - Modern IntelliJ IDEA styled IDE built with Flutter and Rust Core"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  http: ^1.2.0
  markdown: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  vm_service: any
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
